[package]
name = "zhuopu-desktop"
version = "1.1.2"
description = "琢璞英语讲评工作台 · Tauri 桌面壳"
authors = ["Northland Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
