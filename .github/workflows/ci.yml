name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: 安装 / 类型检查 / 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（服务端 + 前端）
        run: pnpm typecheck

      - name: 构建
        run: pnpm build

      - name: 数据库迁移自检
        env:
          JWT_SECRET: ci-only-secret-value-please-change-1234567890
          SMTP_PASS: ci-dummy-password
        run: pnpm --filter zhuopu-server migrate
